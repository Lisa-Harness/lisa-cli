name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        # Resolves all framework deps from PyPI — no sibling checkout required.
        # This validates the "clone just cli and run" path.
        run: uv sync --no-sources --extra dev

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check hosts/cli/src

      - name: Lint (ruff)
        run: uv run --no-sync ruff check hosts/cli/src

      - name: Unit tests (no live)
        run: uv run --no-sync pytest -m "not live" --tb=short -v

  license:
    name: License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The MIT text is committed twice: once at the repo root (the canonical
      # copy GitHub surfaces) and once inside the published package
      # (hosts/cli/LICENSE, which setuptools ships in the wheel/sdist).
      # They must stay byte-identical.
      - name: License copies match
        run: cmp LICENSE hosts/cli/LICENSE

      - name: License expression is declared
        run: |
          grep -q '^license = "MIT"$' hosts/cli/pyproject.toml
          grep -q '^license-files = \["LICENSE"\]$' hosts/cli/pyproject.toml

  diagnose-smoke:
    name: Diagnose smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
      LISA_DATA_DIR: ${{ github.workspace }}/.lisa-smoke
      LISA_PACKS_VENV: ${{ github.workspace }}/.lisa-smoke-packs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-sources --extra dev

      - name: Configure offline smoke manifest
        shell: bash
        run: |
          mkdir -p "$LISA_DATA_DIR/config"
          cp .github/fixtures/models.yaml "$LISA_DATA_DIR/config/models.yaml"

      - name: Run verify
        run: uv run --no-sync lisa verify