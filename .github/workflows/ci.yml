name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    uses: ./.github/workflows/docs.yml

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # Resolves all framework deps from PyPI — no sibling checkout required.
        # This validates the "clone just cli and run" path. The prompt extra
        # also provides prompt_toolkit so the strict mypy run sees a typed
        # dependency instead of import-not-found stub misses.
        run: uv sync --no-sources --extra dev --extra prompt

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Direct I/O policy (allowlist)
        run: uv run --no-sync python scripts/check_direct_io_policy.py

      - name: Type check (mypy — all workspace source packages)
        run: uv run --no-sync mypy

      - name: Dead code (vulture)
        run: uv run --no-sync vulture

      - name: Architecture boundaries
        run: uv run --no-sync lint-imports

  installers:
    name: Installer Python selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash installer
        run: bash tests/install.sh
      - name: Test PowerShell installer
        shell: pwsh
        run: ./tests/install.ps1

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      COVERAGE_FILE: .coverage.${{ matrix.os }}.py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        # Resolves all framework deps from PyPI — no sibling checkout required.
        # This validates the "clone just cli and run" path. The prompt extra
        # provides prompt_toolkit: the TUI prompt tests exercise real key
        # bindings (KeyProcessor match), so they need it installed.
        run: uv sync --no-sources --extra dev --extra prompt

      # Format and lint run only in the ubuntu Quality gates job: a Windows
      # checkout is CRLF (runner autocrlf), so ruff format --check flags every
      # source file regardless of the committed content.

      - name: Offline tests and package coverage floors
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python scripts/check_coverage.py --run --skip-changed-lines

      - name: Upload coverage data for matrix aggregation
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  changed-coverage:
    name: Changed-line coverage
    needs: test
    runs-on: ubuntu-latest
    env:
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # --no-sources: resolve the lisa-harness packages from PyPI wheels
        # (no sibling ../lisa checkout exists in CI).
        run: uv sync --no-sources --extra dev

      - name: Download matrix coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Enforce changed-line coverage across the OS matrix
        run: |
          uv run --no-sync coverage combine --keep coverage-artifacts
          if [ -n "$COVERAGE_BASE" ]; then
            uv run --no-sync python scripts/check_changed_coverage.py --base "$COVERAGE_BASE"
          else
            uv run --no-sync python scripts/check_changed_coverage.py
          fi

  license:
    name: License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The MIT text is committed twice: once at the repo root (the canonical
      # copy GitHub surfaces) and once inside the published package
      # (hosts/cli/LICENSE, which setuptools ships in the wheel/sdist).
      # They must stay byte-identical.
      - name: License copies match
        run: cmp LICENSE hosts/cli/LICENSE

      - name: License expression is declared
        run: |
          grep -q '^license = "MIT"$' hosts/cli/pyproject.toml
          grep -q '^license-files = \["LICENSE"\]$' hosts/cli/pyproject.toml

  diagnose-smoke:
    name: Diagnose smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
      LISA_DATA_DIR: ${{ github.workspace }}/.lisa-smoke
      LISA_PACKS_VENV: ${{ github.workspace }}/.lisa-smoke-packs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-sources --extra dev

      - name: Configure offline smoke manifest
        shell: bash
        run: |
          mkdir -p "$LISA_DATA_DIR/config"
          cp .github/fixtures/models.yaml "$LISA_DATA_DIR/config/models.yaml"

      - name: Run verify
        run: uv run --no-sync lisa verify

  merge-gate:
    name: Merge gate
    if: ${{ always() }}
    needs: [quality, test, changed-coverage, docs, installers, license, diagnose-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHANGED_COVERAGE_RESULT: ${{ needs.changed-coverage.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
          DIAGNOSE_SMOKE_RESULT: ${{ needs.diagnose-smoke.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$CHANGED_COVERAGE_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$INSTALLERS_RESULT" = success
          test "$LICENSE_RESULT" = success
          test "$DIAGNOSE_SMOKE_RESULT" = success