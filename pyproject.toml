[project]
name = "lisa-host-cli-workspace"
version = "0.1.0"
description = "Workspace for the Lisa terminal CLI host package"
requires-python = ">=3.11"
dependencies = [
    "lisa-host-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["hosts/cli"]

[tool.uv.sources]
lisa-host-cli = { workspace = true }
# When the `dev` extra is installed alongside a sibling ../lisa framework
# checkout, uncomment these to resolve framework packages as editable path
# deps instead of from PyPI. This enables live development against framework
# HEAD without publishing. The default install (without these) pulls all
# framework packages from PyPI so the CLI works as a standalone clone.
# lisa-host-runtime = { path = "../lisa/host", editable = true }
# lisa-kernel = { path = "../lisa/kernel", editable = true }
# lisa-sdk = { path = "../lisa/sdk", editable = true }
# lisa-mcp-servers = { path = "../lisa/mcp_server", editable = true }
# lisa-pack-memory = { path = "../lisa/sdk/packs/memory", editable = true }
# lisa-pack-core = { path = "../lisa/sdk/packs/core", editable = true }
# lisa-pack-introspect = { path = "../lisa/sdk/packs/introspect", editable = true }
# lisa-pack-checkpoint = { path = "../lisa/sdk/packs/checkpoint", editable = true }
# lisa-pack-recovery = { path = "../lisa/sdk/packs/recovery", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLC0415", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
line-ending = "lf"