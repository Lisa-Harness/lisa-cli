[project]
name = "lisa-cli-root"
version = "0.2.0"
description = "Workspace for the Lisa Harness CLI"
requires-python = ">=3.11"
dependencies = [
    "lisa-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]
# Forward to the lisa-cli member extra: the CI matrix installs --extra
# prompt so the TUI prompt tests can exercise real prompt_toolkit bindings.
prompt = ["lisa-cli[prompt]"]
markdown = ["lisa-pack-markdown"]
personas = ["lisa-pack-personas"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["hosts/cli"]

[tool.uv.sources]
lisa-cli = { workspace = true }
lisa-harness-runtime = { path = "../lisa/runtime", editable = true }
lisa-harness-kernel = { path = "../lisa/kernel", editable = true }
lisa-harness-sdk = { path = "../lisa/sdk", editable = true }
lisa-harness-mcp-servers = { path = "../lisa/mcp_server", editable = true }
lisa-pack-memory = { path = "../lisa/sdk/packs/memory", editable = true }
lisa-pack-core = { path = "../lisa/sdk/packs/core", editable = true }
lisa-pack-introspect = { path = "../lisa/sdk/packs/introspect", editable = true }
lisa-pack-recovery = { path = "../lisa/sdk/packs/recovery", editable = true }
lisa-pack-markdown = { path = "../lisa-packs/markdown", editable = true }
lisa-pack-personas = { path = "../lisa-packs/personas", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLC0415", "PLR2004"]
# Startup ordering and lazy imports keep CLI help fast; Typer owns command signatures.
"**/hosts/cli/main.py" = ["E402", "PLC0415", "PLR0917"]
"**/hosts/cli/render.py" = ["PLC0415"]
# Interactive entry is imported only on the no-args path; the PT prompt
# glyph is intentional (matches the transport's palette).
"**/hosts/cli/entry.py" = ["PLC0415", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
line-ending = "lf"
