[project]
name = "lisa-harness-cli-root"
version = "0.1.0"
description = "Workspace for the Lisa terminal CLI"
requires-python = ">=3.11"
dependencies = [
    "lisa-harness-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]
markdown = ["lisa-pack-markdown"]
personas = ["lisa-pack-personas"]
search = ["lisa-pack-search"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["hosts/cli"]

[tool.uv.sources]
lisa-harness-cli = { workspace = true }
lisa-harness-runtime = { path = "../../lisa/host", editable = true }
lisa-harness-kernel = { path = "../../lisa/kernel", editable = true }
lisa-harness-sdk = { path = "../../lisa/sdk", editable = true }
lisa-harness-mcp-servers = { path = "../../lisa/mcp_server", editable = true }
lisa-pack-memory = { path = "../../lisa/sdk/packs/memory", editable = true }
lisa-pack-core = { path = "../../lisa/sdk/packs/core", editable = true }
lisa-pack-introspect = { path = "../../lisa/sdk/packs/introspect", editable = true }
lisa-pack-recovery = { path = "../../lisa/sdk/packs/recovery", editable = true }
lisa-pack-search = { path = "../../lisa-packs/search", editable = true }
lisa-pack-markdown = { path = "../../lisa-packs/markdown", editable = true }
lisa-pack-personas = { path = "../../lisa-packs/personas", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLC0415", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
line-ending = "lf"