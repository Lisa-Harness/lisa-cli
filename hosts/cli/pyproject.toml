[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "lisa-harness-cli"
version = "0.1.0"
description = "Terminal CLI for the Lisa Harness"
requires-python = ">=3.11"
dependencies = [
    "lisa-harness-runtime",
    "lisa-harness-kernel",
    "lisa-harness-sdk",
    "lisa-harness-mcp-servers",
    "lisa-pack-core",
    "lisa-pack-introspect",
    "lisa-pack-memory",
    "lisa-pack-recovery",
    "openai>=1.30.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
lisa = "hosts.cli.main:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLC0415", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10