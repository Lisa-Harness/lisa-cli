[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "lisa-cli"
version = "0.4.0"
description = "Terminal CLI for the Lisa Harness"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lisa-harness-runtime>=0.5.2",
    "lisa-harness-kernel>=0.5.2",
    "lisa-harness-sdk>=0.5.2",
    "lisa-harness-mcp-servers>=0.5.2",
    "lisa-pack-core>=0.5.2",
    "lisa-pack-introspect>=0.5.2",
    "lisa-pack-memory>=0.5.2",
    "lisa-pack-recovery>=0.5.2",
    "openai>=1.30.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
lisa = "hosts.cli.main:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]
# Interactive no-args `lisa prompt` editor: single-box input with
# history. Without the extra the plain EOF-terminated reader is used.
prompt = ["prompt-toolkit>=3.0"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    # The offline scenarios import the scripted-model double from the
    # published ``lisa-harness-e2e`` distribution's source tree (the same
    # ``e2etest.scripted`` module the wheels ship; CI resolves the dist
    # from PyPI wheels — see docs/SPEC/CLI_INTEGRATION_LAYER.md).
    # Relative to this member root: ``hosts/cli/../../../lisa/e2etest/src``
    # is ``<sibling>/lisa/e2etest/src``.
    "../../../lisa/e2etest/src",
]
testpaths = ["tests"]
# An xfail that unexpectedly passes must fail the suite, so a fixed bug
# flips its regression guard back on instead of silently staying skipped.
xfail_strict = true
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
]
source_pkgs = ["hosts.cli"]

[tool.coverage.paths]
source = [
    "src",
    "*/src",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    ".*/tests/.*",
    ".*/test_[^/]*\\.py$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PL",
    "C90",
    "RET",
    "RUF",
    "W",
    "YTT",
    "C4",
    "PERF",
    "PIE",
    "FURB",
    "G",
]
ignore = ["PLR0913", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLC0415", "PLR2004", "PLR0917"]
"**/hosts/cli/main.py" = ["E402", "PLC0415", "PLR0917"]
"**/hosts/cli/render.py" = ["PLC0415"]
"**/hosts/cli/entry.py" = ["PLC0415", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 50
max-locals = 15

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src/hosts/cli"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["vulture_allowlist.py", '(^|/)(tests|test_[^/]*\.py$)']

[tool.vulture]
paths = ["src/hosts/cli", "vulture_allowlist.py"]
min_confidence = 80
exclude = [
    "**/tests/",
    "**/test_*.py",
    "**/conftest.py",
    "**/*egg-info*/",
    "**/__pycache__/",
    ".venv/",
]
ignore_names = [
    "main",
    "*SignalCollector",
    "*Collector",
    "*ProcessingLoop",
    "*Detector",
    "*Registry",
    "*Store",
    "*Broker",
    "*Catalog",
    "*Spec",
    "*Config",
    "*Policy",
    "*Manifest",
    "*Error",
    "*Exception",
    "*Context",
    "*Fragments",
    "*Sections",
    "*Evidence",
    "*Summary",
    "*Anomalies",
]
ignore_decorators = ["@property"]